server {
  port = 8082
}

db {
  url       = "jdbc:postgresql://localhost:5432/finatom_ledger"
  url       = ${?DB_URL}
  user      = "finatom_user"
  user      = ${?DB_USER}
  password  = "finatom_password"
  password  = ${?DB_PASSWORD}
  pool-size = 10
}

redis {
  host = "localhost"
  host = ${?REDIS_HOST}
  port = 6379
}

account-service {
  grpc-host = "localhost"
  grpc-host = ${?ACCOUNT_SERVICE_GRPC_HOST}
  grpc-port = 9091
  grpc-port = ${?ACCOUNT_SERVICE_GRPC_PORT}
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
}
