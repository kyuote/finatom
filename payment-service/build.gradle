plugins {
    id 'java'
    id 'groovy'
    id 'application'
    id 'com.google.protobuf' version '0.9.4'
    id 'io.github.goooler.shadow' version '8.1.8'
}

application {
    mainClass = 'com.finatom.payment.PaymentApplication'
}

group = 'com.finatom'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.sparkjava:spark-core:2.9.4'
    implementation 'org.slf4j:slf4j-simple:2.0.12'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    implementation 'org.jooq:jooq:3.19.5'
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'org.flywaydb:flyway-core:10.10.0'
    implementation 'org.flywaydb:flyway-database-postgresql:10.10.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    implementation 'redis.clients:jedis:5.1.2'
    implementation 'com.typesafe:config:1.4.3'
    implementation 'org.apache.kafka:kafka-clients:3.7.0'

    implementation 'io.micrometer:micrometer-core:1.13.0'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.13.0'

    implementation 'io.grpc:grpc-stub:1.64.0'
    implementation 'io.grpc:grpc-protobuf:1.64.0'
    implementation 'io.grpc:grpc-netty-shaded:1.64.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation platform('org.spockframework:spock-bom:2.4-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'net.bytebuddy:byte-buddy:1.14.12'
    testImplementation 'org.objenesis:objenesis:3.3'
    testImplementation 'io.micrometer:micrometer-core:1.13.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation platform('org.testcontainers:testcontainers-bom:1.19.8')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:spock'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.64.0'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

shadowJar {
    mergeServiceFiles()
}

test {
    systemProperty 'db.migration.path', "${rootDir}/account-service/src/main/resources/db/migration"
    useJUnitPlatform()
}
