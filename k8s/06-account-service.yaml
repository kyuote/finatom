apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: finatom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: finatom/account-service:latest
          ports:
            - containerPort: 8081
            - containerPort: 9091
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: finatom-config
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: finatom-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finatom-db-secret
                  key: password
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: finatom
spec:
  selector:
    app: account-service
  ports:
    - name: http
      port: 8081
    - name: grpc
      port: 9091
