apiVersion: apps/v1
kind: Deployment
metadata:
  name: antifraud-service
  namespace: finatom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: antifraud-service
  template:
    metadata:
      labels:
        app: antifraud-service
    spec:
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until PGPASSWORD=$DB_PASSWORD psql -h postgres -U $DB_USER -d finatom_ledger -c "SELECT 1 FROM payments LIMIT 1;" > /dev/null 2>&1; do
                echo "Waiting for payments table..."; sleep 3;
              done
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: finatom-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finatom-db-secret
                  key: password
      containers:
        - name: antifraud-service
          image: finatom/antifraud-service:latest
          imagePullPolicy: Never
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: finatom-config
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: finatom-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finatom-db-secret
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: finatom-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "300m"
