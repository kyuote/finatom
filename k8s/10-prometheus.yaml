apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: finatom
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: account-service
        static_configs:
          - targets: ['account-service:8081']
        metrics_path: /metrics

      - job_name: payment-service
        static_configs:
          - targets: ['payment-service:8082']
        metrics_path: /metrics

      - job_name: antifraud-service
        static_configs:
          - targets: ['antifraud-service:8083']
        metrics_path: /metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: finatom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.2
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: finatom
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
