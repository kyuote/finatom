pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'org.jooq.jooq-codegen-gradle' version '3.19.5'
    }
}

rootProject.name = 'finatom'
include 'account-service'
include 'payment-service'
include 'antifraud-service'
include 'notification-service'
