version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finatom-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finatom_user
      POSTGRES_PASSWORD: finatom_password
      POSTGRES_DB: finatom_ledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finatom_user -d finatom_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finatom-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
